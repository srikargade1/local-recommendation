services:
  - type: web
    name: backend
    env: docker
    repo: https://github.com/srikargade1/local-recommendation
    dockerfilePath: backend/Dockerfile
    dockerContext: ./backend
    buildCommand: ""
    startCommand: ""
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production

  - type: web
    name: frontend
    env: docker
    repo: https://github.com/srikargade1/local-recommendation
    dockerfilePath: frontend/Dockerfile
    dockerContext: ./frontend
    buildCommand: ""
    startCommand: ""
    plan: free
    autoDeploy: true
